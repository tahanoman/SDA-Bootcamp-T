name: Trigger auto deployment for dev-aca-sp2

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ stage-10 ]
    paths:
    - '**'
    - '.github/workflows/dev-aca-sp2-AutoDeployTrigger-90aee072-64cb-4352-ae75-576c4cacd942.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.DEVACASP2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEVACASP2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEVACASP2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: devacrsp2.azurecr.io
          registryUsername: ${{ secrets.DEVACASP2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEVACASP2_REGISTRY_PASSWORD }}
          containerAppName: dev-aca-sp2
          resourceGroup: dev-week7-sp2
          imageToBuild: devacrsp2.azurecr.io/dev-aca-sp2:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


