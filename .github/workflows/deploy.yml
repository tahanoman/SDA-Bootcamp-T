name: Python App CI/CD Pipeline with Direct Deployment

on:
  push:
    branches:
      - stage-5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip' # caching pip dependencies
    - run: |
        pip install -r requirements.txt

    # Run tests
    - name: Run tests
      run: |
        echo "Run tests"

    # Deploy directly to VM
    - name: Deploy to VM
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      run: |
        echo "Setting up SSH key..."
        echo "${DEPLOY_KEY}" > deploy_key.pem
        chmod 400 deploy_key.pem

        echo "Connecting to VM and deploying application..."
        ssh -o StrictHostKeyChecking=no -i deploy_key.pem $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          set -e
          echo "Navigating to application path..."
          cd /home/$DEPLOY_USER/${{ github.event.repository.name }}

          echo "Pulling latest changes..."
          git pull  # No git reset --hard to avoid discarding uncommitted changes

          echo "Installing dependencies"
          
          /home/$DEPLOY_USER/miniconda3/envs/myenv2/bin/pip install --upgrade pip
          /home/$DEPLOY_USER/miniconda3/envs/myenv2/bin/pip install -r requirements.txt

          echo "Restarting application service..."
          sudo systemctl restart chromadb
          sudo systemctl restart backend
          sudo systemctl restart frontend

          echo "Deployment completed successfully!"
        EOF