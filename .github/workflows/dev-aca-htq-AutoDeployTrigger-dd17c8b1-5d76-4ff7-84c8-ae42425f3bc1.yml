name: Trigger auto deployment for dev-aca-htq

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ stage-10 ]
    paths:
    - '**'
    - '.github/workflows/dev-aca-htq-AutoDeployTrigger-dd17c8b1-5d76-4ff7-84c8-ae42425f3bc1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.DEVACAHTQ_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEVACAHTQ_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEVACAHTQ_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: devacrhtq.azurecr.io
          registryUsername: ${{ secrets.DEVACAHTQ_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEVACAHTQ_REGISTRY_PASSWORD }}
          containerAppName: dev-aca-htq
          resourceGroup: dev-week7-htq
          imageToBuild: devacrhtq.azurecr.io/dev-aca-htq:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


